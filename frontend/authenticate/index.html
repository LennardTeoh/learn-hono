<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Verify Authenticity · LUMIÈRE</title>
  
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/js/config.js"></script>
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--pb-cream);">
  
  <header id="site-header" class="shrink-0"></header>
  
  <main class="pb-main flex-grow w-full" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 3rem; padding-bottom: 3rem;">
    <div style="max-width: 500px; width: 100%;">
      <span class="pb-kicker" style="margin: 0 auto 1rem;">LUMIÈRE LEDGER</span>
      <h1 class="pb-display" style="font-size: clamp(2rem, 4vw, 2.5rem); margin-bottom: 1rem;">VERIFY AUTHENTICITY</h1>
      
      <p style="color: var(--pb-muted); line-height: 1.65; margin-bottom: 2.5rem; font-family: sans-serif; font-size: 0.95rem;">
        Enter your product's unique serial number. Our system will check the external database to verify its origin and authenticity.
      </p>
      
      <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
        <div>
          <label for="serial-input" style="display: block; font-family: sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; color: var(--pb-ink); font-weight: 600;">
            Product Serial Number
          </label>
          <input 
            type="text" 
            id="serial-input" 
            class="pb-field" 
            placeholder="E.G. LMR-XXXX-XXXX-XXXX" 
            required 
            style="width: 100%; box-sizing: border-box; text-transform: uppercase;"
          >
        </div>
        
        <button type="submit" class="pb-button" style="width: 100%; margin-top: 0.5rem;">Verify Serial Number</button>
      </form>

      <div id="success-box" style="display: none; margin-top: 2.5rem; padding: 2rem; background: var(--pb-card); border: 1px solid var(--pb-line); border-radius: 1.2rem; text-align: center;">
         <h3 class="pb-display" style="color: var(--pb-peach); font-size: 1.5rem; margin: 0 0 1rem 0;">Item Verified Authentic</h3>
         <p style="margin: 0; color: var(--pb-muted); font-family: sans-serif; font-size: 0.95rem; line-height: 1.6;">
            Serial: <strong id="display-serial" style="color: var(--pb-ink);"></strong><br>
            Model: <span style="color: var(--pb-ink);">Diamond Tennis Bracelet</span>
         </p>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="shrink-0"></footer>
  
  <script type="module" src="/js/authenticate.js"></script>
</body>
</html>
