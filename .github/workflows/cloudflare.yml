name: CI and deploy PetitBakery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Validate runtime secrets
        run: test -n "$BETTER_AUTH_SECRET" && test -n "$RESEND_API_KEY" && test -n "$TURNSTILE_SECRET_KEY"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - run: node scripts/migration-preflight.mjs
      - run: printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
        working-directory: backend
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        working-directory: backend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - run: printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
        working-directory: backend
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - run: npm run db:migrate:remote --prefix backend
      - run: npm run deploy --prefix backend
      - run: npx wrangler pages deploy ../frontend --project-name petitbakery --branch main
        working-directory: backend
