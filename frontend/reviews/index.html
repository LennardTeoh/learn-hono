<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Reviews | LUMIÈRE</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf9f6] text-gray-900 font-sans antialiased">
  <header class="border-b border-gray-200 bg-white py-6">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <a href="/" class="text-2xl font-serif tracking-widest">LUMIÈRE</a>
      <nav class="space-x-6 text-sm uppercase tracking-wider">
        <a href="/" class="hover:text-gray-600">Home</a>
        <a href="/catalog-lookup" class="hover:text-gray-600">Catalog</a>
        <a href="/account" class="hover:text-gray-600">Account</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-serif text-center mb-3">Client Feedback</h1>
    <p class="text-gray-500 text-center mb-12">Discover experiences from our valued collectors or leave your own review.</p>

    <!-- Review Form -->
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm mb-16">
      <h3 class="text-2xl font-serif mb-6">Leave a Review</h3>
      <form id="review-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
          <select id="review-rating" class="w-full border border-gray-300 rounded-lg p-3 bg-white">
            <option value="5">★★★★★ — Exceptional (5/5)</option>
            <option value="4">★★★★☆ — Very Satisfied (4/5)</option>
            <option value="3">★★★☆☆ — Average (3/5)</option>
            <option value="2">★★☆☆☆ — Below Expectations (2/5)</option>
            <option value="1">★☆☆☆☆ — Poor (1/5)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Review Title</label>
          <input type="text" id="review-title" required class="w-full border border-gray-300 rounded-lg p-3" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Your Experience</label>
          <textarea id="review-comment" required rows="4" class="w-full border border-gray-300 rounded-lg p-3"></textarea>
        </div>
        <button type="submit" class="w-full bg-gray-900 text-white py-3.5 rounded-lg font-medium hover:bg-gray-800 transition">Publish Review</button>
      </form>
    </div>

    <!-- Feed -->
    <div class="space-y-6">
      <h3 class="text-2xl font-serif mb-6">Community Reviews</h3>
      <div id="reviews-list" class="space-y-6">
        <p class="text-gray-400 text-center py-8">Loading reviews...</p>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/reviews.js"></script>
</body>
</html>
