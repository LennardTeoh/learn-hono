<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/config.js"></script>
    <title>Payment · LUMIÈRE</title>
</head>
<body class="bg-slate-50 text-slate-900">
    <header id="site-header" class="sticky top-0 z-40"></header>
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-black tracking-tight">Payment</h1>
        <p class="mt-2 text-slate-500">Secure demo payment — no real charges will be made.</p>
        
        <div id="payment-root" class="mt-8 grid gap-8 lg:grid-cols-[1fr_380px]">
            <form id="payment-form" class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="text-xl font-black">Select payment method</h2>
                
                <div class="mt-6 space-y-4">
                    <!-- Credit Card Option -->
                    <label class="block cursor-pointer rounded-xl border border-slate-200 p-4 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-4">
                            <input type="radio" name="paymentMethod" value="card" checked class="h-4 w-4 border-slate-300 text-slate-950 focus:ring-slate-950">
                            <div class="font-medium text-slate-900">Credit or debit card</div>
                        </div>
                        
                        <!-- Card Fields -->
                        <div id="card-fields" class="mt-4 grid gap-4 pl-8">
                            <input type="text" id="card-num" placeholder="Card number" required maxlength="19" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-950 focus:outline-none focus:ring-1 focus:ring-slate-950">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="card-exp" placeholder="MM / YY" required maxlength="5" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-950 focus:outline-none focus:ring-1 focus:ring-slate-950">
                                <input type="text" id="card-cvc" placeholder="CVC" required maxlength="4" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-950 focus:outline-none focus:ring-1 focus:ring-slate-950">
                            </div>
                            <input type="text" id="card-name" placeholder="Name on card" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-950 focus:outline-none focus:ring-1 focus:ring-slate-950">
                        </div>
                    </label>

                    <!-- FPX Option -->
                    <label class="block cursor-pointer rounded-xl border border-slate-200 p-4 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-4">
                            <input type="radio" name="paymentMethod" value="fpx" class="h-4 w-4 border-slate-300 text-slate-950 focus:ring-slate-950">
                            <div class="font-medium text-slate-900">FPX Online Banking</div>
                        </div>
                        
                        <!-- Bank Selection -->
                        <div id="fpx-fields" class="mt-4 hidden pl-8">
                            <select id="fpx-bank" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-slate-950 focus:outline-none focus:ring-1 focus:ring-slate-950 bg-white">
                                <option value="" disabled selected>Select your bank...</option>
                                <option value="maybank">Maybank2U</option>
                                <option value="cimb">CIMB Clicks</option>
                                <option value="public">Public Bank</option>
                                <option value="rhb">RHB Now</option>
                                <option value="hlb">Hong Leong Connect</option>
                                <option value="ambank">AmBank</option>
                            </select>
                        </div>
                    </label>
                    
                    <!-- E-Wallet Option -->
                    <label class="block cursor-pointer rounded-xl border border-slate-200 p-4 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-4">
                            <input type="radio" name="paymentMethod" value="ewallet" class="h-4 w-4 border-slate-300 text-slate-950 focus:ring-slate-950">
                            <div class="font-medium text-slate-900">Touch 'n Go eWallet / GrabPay</div>
                        </div>
                        
                        <!-- QR Code Container -->
                        <div id="ewallet-fields" class="mt-4 hidden pl-8 text-center pb-2">
                            <p class="text-sm text-slate-500 mb-4">Scan the QR code below using your e-wallet app.</p>
                            <img src="/assets/tngQR.png" alt="TnG QR Code" class="mx-auto w-44 h-44 rounded-xl border border-slate-200 p-2 bg-white object-contain">
                        </div>
                    </label>
                </div>
                
                <button type="submit" class="mt-8 w-full rounded-xl bg-slate-950 px-5 py-3 font-semibold text-white hover:bg-slate-800">Pay and place order</button>
            </form>
            <aside id="order-summary"></aside>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/js/payment.js"></script>
</body>
</html>
