<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/js/config.js"></script>
  <title>Receipt · LUMIÈRE</title>
</head>
<body class="bg-slate-50 text-slate-900">
  
  <header id="site-header" class="sticky top-0 z-40"></header>
  
  <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8 min-h-[75vh]">
    <div class="mb-8">
      <a href="/account/" class="text-sm font-semibold text-slate-500 hover:text-slate-900 transition-colors">&larr; Back to Account</a>
    </div>

    <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-12 shadow-sm">
      <div class="border-b border-slate-200 pb-8 mb-8 flex flex-wrap justify-between items-end gap-4">
        <div>
          <h1 class="text-3xl font-black mb-1 text-slate-900">Receipt</h1>
          <p id="receipt-date" class="text-slate-500 text-sm">Loading date...</p>
        </div>
        <div class="text-right">
          <p class="text-xs font-bold tracking-widest text-slate-400 uppercase mb-1">Order Number</p>
          <p id="receipt-id" class="font-mono text-sm text-slate-900">...</p>
        </div>
      </div>

      <div id="receipt-items" class="space-y-6 mb-8 min-h-[150px]">
        <p class="text-slate-500 text-center py-10">Loading items...</p>
      </div>

      <div class="border-t border-slate-200 pt-6">
        <div class="flex justify-between items-center text-xl font-black text-slate-900">
          <span>Total</span>
          <span id="receipt-total">RM 0.00</span>
        </div>
        <p id="receipt-status" class="text-right text-xs uppercase tracking-wide font-bold mt-2 text-emerald-600"></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  
  <script type="module" src="/js/receipt.js"></script>
</body>
</html>
