<!doctype html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="js/config.js"></script><title>Forgot password · PetitBakery</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head>
<body class="bg-slate-50 text-slate-900"><header id="site-header"></header><main class="mx-auto max-w-md px-4 py-14 sm:px-6"><div class="rounded-3xl border border-slate-200 bg-white p-7 shadow-sm"><h1 class="text-3xl font-black">Reset your password</h1>
<p class="mt-2 text-sm leading-6 text-slate-500">We will email a time-limited reset link if the account exists.</p>
<form id="forgot-form" class="mt-6 space-y-4">
<label class="block"><span class="text-sm font-medium">Email</span><input name="email" type="email" required autocomplete="email" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></label>
<input type="hidden" name="turnstileToken"><div data-turnstile></div>
<button type="submit" class="w-full rounded-xl bg-slate-950 px-5 py-3 font-semibold text-white">Send reset link</button>
</form><p id="forgot-status" class="mt-4 text-sm text-emerald-700"></p></div></main><footer id="site-footer"></footer><script type="module" src="js/auth-pages.js"></script></body></html>
